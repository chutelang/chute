name: Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Bump versions
        id: bump
        run: |
          version=$(bash scripts/bump-version.sh ${{ inputs.release_type }})
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push --follow-tags origin master

      - name: Build
        run: pnpm --filter @chutelang/cli build

      - name: Publish packages
        run: |
          for dir in packages/compiler packages/formatter packages/linter packages/lsp packages/cli; do
            name=$(node -p "require('./$dir/package.json').name")

            provenance=""
            if npm view "$name" --json > /dev/null 2>&1; then
              provenance="--provenance"
            fi

            echo "Publishing $name $provenance"
            (cd "$dir" && pnpm publish --access public --no-git-checks $provenance)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --generate-notes \
            --title "v${{ steps.bump.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
